name: Internal Extension Browser Security

on:
  push:
    branches: [develop]
    paths:
      - "packages/nc-gui/components/internalExtensions/**"
      - "packages/nc-gui/components/dashboard/settings/base/index.vue"
      - "packages/nc-gui/composables/internalExtensions/**"
      - "packages/nc-gui/test/internal-extensions-browser/**"
      - "packages/nc-gui/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/internal-extension-browser-security.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
    branches: [develop]
    paths:
      - "packages/nc-gui/components/internalExtensions/**"
      - "packages/nc-gui/components/dashboard/settings/base/index.vue"
      - "packages/nc-gui/composables/internalExtensions/**"
      - "packages/nc-gui/test/internal-extensions-browser/**"
      - "packages/nc-gui/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/internal-extension-browser-security.yml"
  workflow_dispatch:

jobs:
  internal-extension-browser-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'trigger-CI') || !github.event.pull_request.draft }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - name: Prepare npm configuration
        run: sed -i '/^use-node-version/d' .npmrc
      - name: Install GUI dependencies
        run: pnpm install --frozen-lockfile --filter nc-gui...
      - name: Install Chromium
        run: pnpm --filter nc-gui exec playwright install --with-deps chromium
      - name: Run browser authorization regression
        env:
          CI: "true"
        run: pnpm --filter nc-gui test:internal-browser
