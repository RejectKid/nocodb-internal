name: Build Docker handoff ZIP

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the tested ZIP under Releases (default branch only)'
        type: boolean
        default: true
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/internal-docker-handoff.yml'
      - '.gitlab-ci.yml'
      - 'scripts/internal-fork/*handoff*'
      - 'docs/internal-fork/handoff-releases.md'
      - 'deploy/internal-fork/Dockerfile.handoff'
      - 'deploy/internal-fork/handoff/**'

permissions:
  contents: read

concurrency:
  group: docker-handoff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
      NC_HANDOFF_RUN: ${{ github.run_id }}.${{ github.run_attempt }}
      NC_HANDOFF_BROWSER_SMOKE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - name: Build, test and package handoff
        run: sh scripts/internal-fork/ci-handoff.sh
      - name: Upload ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: docker-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .handoff-output/*.zip
            .handoff-output/*.zip.sha256
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
      - name: Summarize download instructions
        run: |
          printf '%s\n' '### Docker handoff ready' 'Download the docker-handoff artifact at the bottom of this run, extract the GitHub artifact, then extract the handoff ZIP inside it.' 'Windows: load-images.ps1 → setup.ps1 → start.ps1. Linux/macOS: sh load-images.sh → sh setup.sh → sh start.sh.' 'Open http://localhost:8080. README.md and FEATURE-TESTS.md are included. Artifact retention: 14 days.' >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: bundle
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - uses: actions/download-artifact@v4
        with:
          name: docker-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: .handoff-output
      - name: Publish verified ZIP and checksum as release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/internal-fork/release-handoff.mjs github
      - name: Link release downloads
        env:
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/handoff-${{ github.run_id }}.${{ github.run_attempt }}
        run: printf '### Release ready\n[Download handoff ZIP and checksum](%s)\n' "$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
