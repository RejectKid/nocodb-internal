name: Dependency Review

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'package-lock.json'
      - '**/package.json'
      - '**/pnpm-lock.yaml'
      - '**/package-lock.json'

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        if: github.repository == 'nocodb/nocodb'
        uses: actions/dependency-review-action@v4

      - name: Setup pnpm for fork lockfile validation
        if: github.repository != 'nocodb/nocodb'
        uses: pnpm/action-setup@v5

      - name: Setup Node for fork lockfile validation
        if: github.repository != 'nocodb/nocodb'
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Validate fork lockfile
        if: github.repository != 'nocodb/nocodb'
        run: pnpm install --frozen-lockfile --ignore-scripts
