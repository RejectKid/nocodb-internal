packages:
  - 'core'
  - 'packages/*'

overrides:
  axios@>=1.0.0 <1.16.0: '>=1.16.0'
  postcss@<8.5.10: '>=8.5.10'
  uuid@>=11.0.0 <11.1.1: ^11.1.1
  vite@>=6.0.0 <6.4.2: '>=6.4.2'
  minimatch@>=9.0.0 <9.0.7: '>=9.0.7'
  picomatch@>=4.0.0 <4.0.4: '>=4.0.4'

onlyBuiltDependencies:
  - esbuild
  - nocodb-sdk
  - vue-demi

# The root bootstrap builds nocodb-sdk explicitly before this nested install.
# Do not fail CI because pnpm skips the local package's redundant prepare hook.
strictDepBuilds: false

allowBuilds:
  nocodb-sdk@file:../nocodb-sdk: set this to true or false
  vue-demi: set this to true or false
