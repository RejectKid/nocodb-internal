name: nocodb-internal-trial-v2

x-environment: &environment
  NC_DB: pg://db:5432?u=nocodb&p=${POSTGRES_PASSWORD:?Run setup first}&d=nocodb
  NC_REDIS_URL: redis://redis:6379
  NC_SITE_URL: ${NC_SITE_URL:-http://localhost:8080}
  NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET:?Run setup first}
  NC_DISABLE_TELE: "true"
  NC_DISABLE_MUX: "true"
  NC_SECURE_ATTACHMENTS: "true"
  NC_GUI_DIST_PATH: /usr/src/app/node_modules/nc-lib-gui/lib/dist
  NC_INTERNAL_EXTENSIONS_ENABLED: "true"
  NC_INTERNAL_ADMIN_ENABLED: "true"
  NC_INTERNAL_TEAMS_ENABLED: "true"
  NC_INTERNAL_FINE_GRAINED_API_TOKENS_ENABLED: "true"
  NC_INTERNAL_BASE_PERMISSIONS_ENABLED: "true"
  NC_INTERNAL_INPUT_VALIDATION_ENABLED: "true"
  NC_INTERNAL_DOCUMENT_PERMISSIONS_ENABLED: "true"
  NC_INTERNAL_FILE_PREVIEW_MODE_ENABLED: "true"
  NC_INTERNAL_DISCUSSION_MODE_ENABLED: "true"

services:
  nocodb:
    image: __HANDOFF_IMAGE__
    platform: linux/amd64
    pull_policy: never
    environment: *environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${NC_BIND_IP:-127.0.0.1}:${NC_PORT:-8080}:8080"
    volumes:
      - nocodb_data:/usr/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
  db:
    image: postgres:17.10
    platform: linux/amd64
    pull_policy: never
    environment:
      POSTGRES_USER: nocodb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup first}
      POSTGRES_DB: nocodb
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocodb -d nocodb"]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7.4-alpine
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  nocodb_data:
  postgres_data:
  redis_data:
